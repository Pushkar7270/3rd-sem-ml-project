[project]
name = "telco-churn-intelligence"
version = "1.0.0"
description = "Explainable customer churn prediction and retention recommendation system for the IBM Telco Customer Churn dataset"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pandas>=2.2,<3.0",
    "numpy>=1.26,<3.0",
    "scikit-learn>=1.5,<2.0",
    "xgboost>=2.1,<4.0",
    "shap>=0.46,<0.50",
    "joblib>=1.4,<2.0",
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic>=2.9,<3.0",
    "matplotlib>=3.9,<4.0",
    "seaborn>=0.13,<1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-cov>=5.0,<7.0",
    "httpx>=0.27,<1.0",
    "ruff>=0.7,<1.0",
    "python-docx>=1.2.0",
]

[project.scripts]
churn-train = "churn.train:main"
churn-serve = "churn.api.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/churn"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::FutureWarning",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# FastAPI's dependency injection uses function calls in argument defaults.
"src/churn/api/main.py" = ["B008"]
